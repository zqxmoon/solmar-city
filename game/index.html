<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar City — an open-world crime game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0c1220;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    display: block;
    background: #dfe6b8;
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<script type="module" src="./js/main.js"></script>
</body>
</html>
